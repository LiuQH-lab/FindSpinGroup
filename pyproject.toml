[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "findspingroup"
description = "FindSpinGroup is a spin space group symmetry analysis toolkit for magnetic materials, first-principles workflows, and high-throughput studies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yutong Yu", email = "karl.yt.yu@gmail.com" }]
maintainers = [{ name = "Yutong Yu", email = "karl.yt.yu@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "seekpath>=2.1.0,<2.2.0",
    "spglib>=2.6.0",
    "spintensor",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["spin space group", "magnetic symmetry", "crystallography", "spglib", "spinCIF"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8.4.2"]
docs = ["mkdocs>=1.6"]

[project.urls]
Homepage = "https://github.com/LiuQH-lab/FindSpinGroup"
Documentation = "https://findspingroup.readthedocs.io/"
"AI Agent Guide" = "https://github.com/LiuQH-lab/FindSpinGroup/blob/main/FSG_AGENT_GUIDE.md"
Repository = "https://github.com/LiuQH-lab/FindSpinGroup"
Issues = "https://github.com/LiuQH-lab/FindSpinGroup/issues"

[tool.setuptools.dynamic]
version = {attr = "findspingroup.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["findspingroup*"]
namespaces = false

[tool.setuptools.package-data]
findspingroup = [
    "core/identify_index/databases/*.db",
    "core/identify_index/data/*.json",
    "core/identify-py-222/databases/*.db",
    "data/ssg_label_acc_kpoint_wave_index_20260604.json",
    "examples/*.mcif",
]

[project.scripts]
fsg = "findspingroup.cli:main"
fsg-batch = "findspingroup.batch_mcif:main"
findspin = "findspingroup.cli:main"
findspin-batch = "findspingroup.batch_mcif:main"
findspingroup = "findspingroup.cli:main"
findspingroup-batch = "findspingroup.batch_mcif:main"
